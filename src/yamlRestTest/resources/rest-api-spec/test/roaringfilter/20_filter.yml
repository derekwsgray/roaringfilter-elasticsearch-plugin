# Integration tests for the roaring bitmap filter script plugin
#
---
setup:
  - do:
      indices.create:
          index:  test

  - do:
      index:
        index:  test
        id:     10
        body:   { "important_field": "foo", "nid": 10 }
  - do:
        index:
          index:  test
          id:     20
          body:   { "important_field": "foo foo foo", "nid": 20 }
  - do:
        index:
          index:  test
          id:     40
          body:   { "important_field": "foo foo", "nid": 40 }
  - do:
        index:
          index:  test
          id:     41
          body:   { "important_field": "not that important", "nid": 41 }
  - do:
        index:
          index:  test
          id:     42
          body:   { "important_field": "even less important!", "nid": 42 }

  - do:
      indices.refresh: {}
---
"document filtering exclude":
  - do:
      search:
        rest_total_hits_as_int: true
        index: test
        body:
          query:
            bool:
              filter:
                script:
                  script:
                      source: "roaring_filter"
                      lang: "roaring_filter"
                      params:
                        operation: "exclude"
                        field: "nid"
                        terms: "OjAAAAEAAAAAAAIAEAAAAAoAFAAjAA=="
  - length: { hits.hits: 3 }
  - match: {hits.hits.0._id: "40" }
  - match: {hits.hits.1._id: "41" }
  - match: {hits.hits.2._id: "42" }
---
"document filtering include":
  - do:
      search:
        rest_total_hits_as_int: true
        index: test
        body:
          query:
            bool:
              filter:
                script:
                  script:
                      source: "roaring_filter"
                      lang: "roaring_filter"
                      params:
                        operation: "include"
                        field: "nid"
                        terms: "OjAAAAEAAAAAAAIAEAAAAAoAFAAjAA=="
  - length: { hits.hits: 2 }
  - match: {hits.hits.0._id: "10" }
  - match: {hits.hits.1._id: "20" }
---
"document filtering exclude with match":
  - do:
      search:
        rest_total_hits_as_int: true
        index: test
        body:
          query:
            bool:
              must:
                - match:
                    important_field: "foo"
              filter:
                script:
                  script:
                      source: "roaring_filter"
                      lang: "roaring_filter"
                      params:
                        operation: "exclude"
                        field: "nid"
                        terms: "OjAAAAEAAAAAAAIAEAAAAAoAFAAjAA=="
  - length: { hits.hits: 1 }
  - match: {hits.hits.0._id: "40" }
---
"document filtering include with match":
  - do:
      search:
        rest_total_hits_as_int: true
        index: test
        body:
          query:
            bool:
              must:
                - match:
                    important_field: "foo"
              filter:
                script:
                  script:
                      source: "roaring_filter"
                      lang: "roaring_filter"
                      params:
                        operation: "include"
                        field: "nid"
                        terms: "OjAAAAEAAAAAAAIAEAAAAAoAFAAjAA=="
  - length: { hits.hits: 2 }
  - match: {hits.hits.0._id: "20" }
  - match: {hits.hits.1._id: "10" }
---
"document filtering without script":
  - do:
      search:
        rest_total_hits_as_int: true
        index: test
        body:
          query:
            function_score:
              query:
                match:
                  important_field: "foo"
  - length: { hits.hits: 3 }
  - match: {hits.hits.0._id: "20" }
  - match: {hits.hits.1._id: "40" }
  - match: {hits.hits.2._id: "10" }
