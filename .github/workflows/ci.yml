name: "CI"

on:
  push:
    branches:
      - "master"
      - "6.x"
  pull_request:
    branches:
      - "master"
      - "6.x"

permissions:
  contents: read

env:
  java-version: "21"

jobs:
  build:
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v4"
      - name: "Set up JDK"
        uses: "actions/setup-java@v4"
        with:
          java-version: "${{ env.java-version }}"
          distribution: "temurin"
      - name: "Gradle build"
        uses: "gradle/actions/setup-gradle@v4"
      - name: "Run build"
        run: "./gradlew clean build --stacktrace"
      - name: "Collect reaper logs on failure"
        if: ${{ failure() }}
        run: |
          find "${GITHUB_WORKSPACE}/.gradle/reaper" -type f 2>/dev/null | while read -r f; do echo "=== $f ==="; cat "$f"; done || true
      - name: "GitHub release"
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/6.x') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -E '^version[[:space:]]*=' gradle.properties | awk -F'=' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2}')
          es_ver=$(grep -E '^elasticsearchVersion[[:space:]]*=' gradle.properties | awk -F'=' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2}')
          tag="v${version}"
          gh release create "${tag}" ./build/distributions/*.zip \
            --title "${tag}" \
            --notes "Elasticsearch **${es_ver}** plugin build **${version}**. Install with \`elasticsearch-plugin install\` and the release asset URL (see README)."
